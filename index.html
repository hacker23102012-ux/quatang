<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật Chị Gái Yêu 🎂💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1b2e 0%, #2a1b3d 50%, #0f0c1b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
            overflow-x: hidden;
            position: relative;
            color: #fff;
        }

        /* BỐ CỤC CHÍNH: 3 CỘT */
        .main-layout {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            max-width: 1280px;
            gap: 15px;
            z-index: 10;
        }

        .side-panel {
            width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .char-box {
            width: 100%;
            height: 320px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 158, 187, 0.3);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 10px;
            backdrop-filter: blur(5px);
        }

        .char-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.6));
        }

        .char-controls {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 5px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ctrl-btn:hover { background: #ff6b81; }

        .file-label {
            background: rgba(255, 158, 187, 0.2);
            border: 1px solid #ff9ebb;
            color: #ffccdf;
            padding: 5px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }

        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 750px;
        }

        header {
            text-align: center;
            color: #ff9ebb;
            margin-bottom: 12px;
        }
        header h1 {
            font-size: 1.8rem;
            text-shadow: 0 0 15px rgba(255, 158, 187, 0.5);
            margin-bottom: 4px;
        }
        header p {
            color: #d1c4e9;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 15px;
            display: inline-block;
        }

        /* Đĩa nhạc & Lyric */
        .music-visualizer {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 18px;
            border-radius: 18px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
        }

        .vinyl-container {
            width: 65px; height: 65px; cursor: pointer; flex-shrink: 0;
        }
        .vinyl-disc {
            width: 100%; height: 100%; background: #111; border-radius: 50%;
            border: 3px solid #333; display: flex; align-items: center; justify-content: center;
            animation: spin 4s linear infinite; animation-play-state: paused;
        }
        .vinyl-disc.playing { animation-play-state: running; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .vinyl-center { width: 20px; height: 20px; background: #ff9ebb; border-radius: 50%; border: 2px solid #fff; }

        .lyric-box { flex: 1; text-align: center; }
        #lyricText { font-size: 0.95rem; color: #ffccdf; font-weight: 600; }

        /* Lưới 20 hộp quà */
        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }
        .gift-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .gift-card:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.2); }
        .gift-card.locked {
            opacity: 0.35 !important;
            cursor: not-allowed !important;
            transform: none !important;
            filter: grayscale(1);
        }
        .gift-icon { font-size: 1.6rem; display: block; margin-bottom: 4px; }
        .gift-title { font-size: 0.75rem; font-weight: 700; color: #ff9ebb; }

        /* BỐ CỤC DƯỚI CÙNG THEO ĐÚNG SƠ ĐỒ (Nút - Thanh - Máy bay) */
        .plane-section {
            display: none; /* Chỉ hiện sau khi mở 1 quà */
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-top: 15px;
            margin-bottom: 15px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Nút Bấm Tròn Bên Trái */
        .click-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
            border: 2px solid #ff9ebb;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-shrink: 0;
        }
        .click-btn:active { transform: scale(0.92); }

        /* Thanh Tiến Trình Hình Chữ Nhật Ở Giữa */
        .progress-bar-container {
            flex: 1;
            height: 28px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 158, 187, 0.4);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(5px);
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff6b81, #ffbe76);
            border-radius: 12px;
            transition: width 0.2s ease;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        /* Máy Bay Bên Phải */
        .plane-static {
            width: 45px;
            height: 45px;
            flex-shrink: 0;
            transition: transform 0.3s;
        }

        /* MÁY BAY FLY CURSOR (Khi cất cánh bay theo chuột) */
        #planeCursor {
            position: fixed;
            width: 50px;
            height: 50px;
            pointer-events: none;
            z-index: 9999;
            display: none;
            transform: translate(-50%, -50%);
        }

        /* PHÁO HOA */
        .firework-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            border-radius: 50%;
            animation: explode 0.8s ease-out forwards;
        }
        @keyframes explode {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
        }

        /* Thanh nhập nhạc */
        .music-bar {
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .music-bar input {
            flex: 1; border: none; outline: none; padding: 6px 10px;
            border-radius: 15px; font-size: 0.8rem;
        }
        .music-bar button {
            background: #ff6b81; color: white; border: none; padding: 6px 12px;
            border-radius: 15px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
        }

        /* Nút Không Nhận Quà */
        .no-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(80, 80, 100, 0.85);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 18px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            z-index: 99;
            transition: top 0.15s ease, left 0.15s ease;
        }

        /* Modal Popup */
        .modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: #2a1b3d; border: 1px solid #ff9ebb; color: #fff;
            padding: 22px; border-radius: 20px; max-width: 380px; width: 100%; text-align: center;
        }
        .modal-icon { font-size: 2.8rem; margin-bottom: 10px; }
        .modal-text { font-size: 0.95rem; line-height: 1.5; margin-bottom: 18px; }
        .close-btn { background: #ff6b81; color: white; border: none; padding: 8px 20px; border-radius: 15px; cursor: pointer; }

        #yt-player-container { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="yt-player-container"><div id="player"></div></div>

    <!-- MÁY BAY FLY CURSOR -->
    <img id="planeCursor" src="https://api.iconify.design/noto:small-airplane.svg" alt="Plane">

    <div class="main-layout">
        
        <!-- BÊN TRÁI -->
        <div class="side-panel">
            <div class="char-box">
                <img id="leftCharImg" src="https://media.tenor.com/Mdz2s-fOMggAAAAj/the-fragrant-flower-blooms-with-dignity-kaoruko-waguri.gif" alt="Char Left">
            </div>
            <div class="char-controls">
                <button class="ctrl-btn" onclick="prevLeftChar()">&lt;</button>
                <label class="file-label">
                    Tải ảnh <input type="file" hidden accept="image/*" onchange="uploadChar(event, 'leftCharImg')">
                </label>
                <button class="ctrl-btn" onclick="nextLeftChar()">&gt;</button>
            </div>
        </div>

        <!-- Ở GIỮA -->
        <div class="center-panel">
            <header>
                <h1>🎉 Chúc Mừng Sinh Nhật Chị Gái 🎂</h1>
                <p>Hãy chọn 1 hộp quà duy nhất để nhận lời chúc đặc biệt nhé! 💖</p>
            </header>

            <div class="music-visualizer">
                <div class="vinyl-container" onclick="togglePlayPause()">
                    <div class="vinyl-disc" id="vinylDisc"><div class="vinyl-center"></div></div>
                </div>
                <div class="lyric-box">
                    <div id="lyricText">🎵 Nhấn vào đĩa nhạc hoặc mở quà để phát nhạc...</div>
                </div>
            </div>

            <!-- 20 Hộp Quà -->
            <div class="gifts-grid" id="giftsContainer"></div>

            <!-- BỐ CỤC DƯỚI CÙNG (Nút - Thanh Tiến Trình - Máy Bay) -->
            <div class="plane-section" id="planeSection">
                <button class="click-btn" onclick="chargePlane()">Bấm<br>Nạp 🚀</button>
                <div class="progress-bar-container">
                    <div class="progress-fill" id="progressFill"></div>
                    <span class="progress-text" id="progressText">Nạp năng lượng: 0/10</span>
                </div>
                <img class="plane-static" id="planeStatic" src="https://api.iconify.design/noto:small-airplane.svg" alt="Static Plane">
            </div>

            <div class="music-bar">
                <span>🎧</span>
                <input type="text" id="ytUrlInput" placeholder="Dán ID YouTube bài hát khác...">
                <button onclick="changeMusic()">Đổi Nhạc</button>
            </div>
        </div>

        <!-- BÊN PHẢI -->
        <div class="side-panel">
            <div class="char-box">
                <img id="rightCharImg" src="https://media.tenor.com/XgHyWyO2BqAAAAAM/kaoruhanawarintosaku-kaoruko.gif" alt="Char Right">
            </div>
            <div class="char-controls">
                <button class="ctrl-btn" onclick="prevRightChar()">&lt;</button>
                <label class="file-label">
                    Tải ảnh <input type="file" hidden accept="image/*" onchange="uploadChar(event, 'rightCharImg')">
                </label>
                <button class="ctrl-btn" onclick="nextRightChar()">&gt;</button>
            </div>
        </div>

    </div>

    <!-- Nút chạy trốn -->
    <button class="no-btn" id="noBtn" onmouseover="dodgeBtn()" ontouchstart="dodgeBtn()">Không nhận tuổi mới 😜</button>

    <!-- Modal Lời Chúc -->
    <div class="modal" id="wishModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">🎁</div>
            <div class="modal-text" id="modalText">Lời chúc...</div>
            <button class="close-btn" onclick="closeModal()">Nhận Lời Chúc 💖</button>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Kho ảnh GIF anime
        const leftPresets = [
            "https://media.tenor.com/Mdz2s-fOMggAAAAj/the-fragrant-flower-blooms-with-dignity-kaoruko-waguri.gif",
            "https://media.tenor.com/lKCbkCShloQAAAAM/horikita.gif"
        ];
        const rightPresets = [
            "https://media.tenor.com/XgHyWyO2BqAAAAAM/kaoruhanawarintosaku-kaoruko.gif",
            "https://media.tenor.com/Mdz2s-fOMggAAAAj/the-fragrant-flower-blooms-with-dignity-kaoruko-waguri.gif"
        ];
        let leftIdx = 0, rightIdx = 0;

        function prevLeftChar() {
            leftIdx = (leftIdx - 1 + leftPresets.length) % leftPresets.length;
            document.getElementById('leftCharImg').src = leftPresets[leftIdx];
        }
        function nextLeftChar() {
            leftIdx = (leftIdx + 1) % leftPresets.length;
            document.getElementById('leftCharImg').src = leftPresets[leftIdx];
        }
        function prevRightChar() {
            rightIdx = (rightIdx - 1 + rightPresets.length) % rightPresets.length;
            document.getElementById('rightCharImg').src = rightPresets[rightIdx];
        }
        function nextRightChar() {
            rightIdx = (rightIdx + 1) % rightPresets.length;
            document.getElementById('rightCharImg').src = rightPresets[rightIdx];
        }

        function uploadChar(event, targetImgId) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { document.getElementById(targetImgId).src = e.target.result; };
            reader.readAsDataURL(file);
        }

        // 20 Lời chúc Sinh Nhật
        const wishes = [
            { icon: "🎂", text: "Chúc mừng sinh nhật chị gái yêu dấu của em! Chúc chị tuổi mới luôn xinh đẹp, rạng rỡ và hạnh phúc viên mãn!" },
            { icon: "💖", text: "Cảm ơn chị vì luôn là người chị tuyệt vời, luôn yêu thương và nhường nhịn em. Chúc chị sinh nhật ngập tràn niềm vui!" },
            { icon: "🌟", text: "Chúc chị tuổi mới gặt hái được thật nhiều thành công mới trong công việc và cuộc sống!" },
            { icon: "🎁", text: "Chúc chị gái mau ăn chóng béo (mà mãi giữ dáng), tiền tài rủng rỉnh, tình yêu thăng hoa nhé!" },
            { icon: "🌸", text: "Mong rằng mọi điều ước trong ngày sinh nhật của chị hôm nay đều sẽ thành hiện thực!" },
            { icon: "👑", text: "Hôm nay là ngày đặc biệt của nữ hoàng nhà mình! Chúc chị một đời bình an và luôn cười tươi thế này nhé." },
            { icon: "🍫", text: "Tặng chị sự ngọt ngào nhất! Chúc cuộc sống của chị luôn tràn ngập những điều ngọt ngào như chiếc bánh kem này." },
            { icon: "💐", text: "Chúc chị tuổi mới thêm một tuổi mới trưởng thành hơn, hạnh phúc hơn và lúc nào cũng gặp may mắn!" },
            { icon: "✨", text: "Chúc chị gái của em luôn giữ vững năng lượng tích cực và nụ cười tỏa nắng mỗi ngày!" },
            { icon: "✈️", text: "Chúc chị tuổi mới có thêm nhiều chuyến đi du lịch khám phá thế giới thật thú vị!" },
            { icon: "💄", text: "Chúc chị ngày càng trẻ trung, xinh đẹp, sắm đồ hiệu mỏi tay không cần nhìn giá!" },
            { icon: "🍀", text: "Chúc chị gặp toàn may mắn, dữ hóa lành, mọi khó khăn đều vượt qua suôn sẻ." },
            { icon: "📸", text: "Chúc chị tuổi mới lúc nào chụp ảnh cũng góc nào cũng đẹp, không góc chết!" },
            { icon: "🧋", text: "Chúc chị ăn uống thả ga, uống trà sữa không bao giờ sợ béo nha!" },
            { icon: "🛍️", text: "Chúc chị sinh nhật ngập tràn quà cáp và được ai đó cưng chiều hết mực!" },
            { icon: "🌷", text: "Chúc chị luôn dịu dàng, hạnh phúc và bình yên trước mọi bão giông cuộc đời." },
            { icon: "🥳", text: "Hôm nay quẩy hết mình đi chị ơi! Chúc mừng sinh nhật chị gái siêu cấp vip pro của em!" },
            { icon: "💎", text: "Chị là món quà quý giá nhất mà bố mẹ ban tặng cho em. Chúc chị sinh nhật vô cùng ý nghĩa!" },
            { icon: "☀️", text: "Chúc chị luôn là ánh nắng ấm áp mang niềm vui và tiếng cười đến cho cả nhà." },
            { icon: "❤️", text: "Yêu chị rất nhiều! Chúc mừng sinh nhật chị gái yêu nhé!" }
        ];

        let hasOpenedGift = false;
        const container = document.getElementById('giftsContainer');
        wishes.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'gift-card';
            card.id = `gift-${index}`;
            card.innerHTML = `<span class="gift-icon">🎁</span><span class="gift-title">Quà #${index + 1}</span>`;
            card.onclick = () => openGift(index);
            container.appendChild(card);
        });

        // Chọn quà -> Khóa tất cả các quà còn lại -> Hiển thị thanh nạp máy bay
        function openGift(index) {
            if (hasOpenedGift) return;
            hasOpenedGift = true;
            ensurePlayMusic();

            const selectedCard = document.getElementById(`gift-${index}`);
            selectedCard.querySelector('.gift-icon').innerText = wishes[index].icon;
            document.getElementById('modalIcon').innerText = wishes[index].icon;
            document.getElementById('modalText').innerText = wishes[index].text;
            document.getElementById('wishModal').style.display = 'flex';

            // Khóa TẤT CẢ 20 HỘP QUÀ
            for (let i = 0; i < 20; i++) {
                document.getElementById(`gift-${i}`).classList.add('locked');
            }

            // Hiện khu vực Nút - Thanh Nạp - Máy Bay bên dưới
            document.getElementById('planeSection').style.display = 'flex';
        }

        function closeModal() { document.getElementById('wishModal').style.display = 'none'; }

        // XỬ LÝ NẠP NĂNG LƯỢNG MÁY BAY
        let clicks = 0;
        const maxClicks = 10;
        let planeFlying = false;

        function chargePlane() {
            if (planeFlying) return;
            clicks++;
            const fillPercent = (clicks / maxClicks) * 100;
            document.getElementById('progressFill').style.width = fillPercent + '%';
            document.getElementById('progressText').innerText = `Nạp năng lượng: ${clicks}/${maxClicks}`;

            // Khi nhấp đủ 10 lần -> Máy bay cất cánh bay theo chuột
            if (clicks >= maxClicks) {
                planeFlying = true;
                document.getElementById('progressText').innerText = "🚀 MÁY BAY ĐÃ CẤT CÁNH!";
                document.getElementById('planeStatic').style.opacity = '0.3'; // Mờ máy bay tĩnh
                document.getElementById('planeCursor').style.display = 'block'; // Hiện máy bay bay theo chuột
            }
        }

        // Theo dõi chuyển động con chuột khi máy bay cất cánh
        document.addEventListener('mousemove', (e) => {
            if (!planeFlying) return;
            const plane = document.getElementById('planeCursor');
            plane.style.left = e.clientX + 'px';
            plane.style.top = e.clientY + 'px';

            // Tự động bắn pháo hoa khi di chuột
            if (Math.random() < 0.25) {
                spawnFirework(e.clientX, e.clientY);
            }
        });

        // Hàm tạo Pháo hoa bắn Hướng Lên (nửa dưới) hoặc Hướng Xuống (nửa trên)
        function spawnFirework(x, y) {
            const isBottomHalf = y > (window.innerHeight / 2);
            const particleCount = 10;
            const colors = ['#ff4757', '#ff6b81', '#ffbe76', '#ffda79', '#1289a7', '#d63031', '#e84393'];

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework-particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = Math.random() * 8 + 4 + 'px';
                particle.style.height = particle.style.width;
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                const angle = (Math.random() * Math.PI) - (Math.PI / 2);
                const speed = Math.random() * 80 + 40;

                let dx = Math.cos(angle) * speed;
                let dy = Math.sin(angle) * speed;

                if (isBottomHalf) {
                    dy = -Math.abs(dy); // Ở nửa dưới -> Bắn LÊN TRÊN
                } else {
                    dy = Math.abs(dy);  // Ở nửa trên -> Bắn XUỐNG DƯỚI
                }

                particle.style.setProperty('--dx', dx + 'px');
                particle.style.setProperty('--dy', dy + 'px');

                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }
        }

        function dodgeBtn() {
            const btn = document.getElementById('noBtn');
            const maxLeft = window.innerWidth - btn.offsetWidth - 20;
            const maxTop = window.innerHeight - btn.offsetHeight - 20;
            btn.style.left = Math.max(20, Math.floor(Math.random() * maxLeft)) + 'px';
            btn.style.top = Math.max(20, Math.floor(Math.random() * maxTop)) + 'px';
            btn.style.bottom = 'auto'; btn.style.right = 'auto';
        }

        // Nhạc & Lyric
        const playlist = [
            {
                id: "2Vv-BfVoq4g",
                lyrics: [
                    { time: 0, text: "🎂 Chúc mừng sinh nhật chị gái yêu dấu..." },
                    { time: 10, text: "💖 Mong những điều tuyệt vời nhất đến với chị..." },
                    { time: 20, text: "🌸 Tuổi mới rạng rỡ và luôn hạnh phúc nhé!" },
                    { time: 35, text: "✨ Cảm ơn chị vì luôn ở bên cạnh gia đình!" }
                ]
            }
        ];
        let player, isPlaying = false, lyricInterval;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0', width: '0', videoId: playlist[0].id,
                playerVars: { 'autoplay': 1, 'controls': 0 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            const disc = document.getElementById('vinylDisc');
            if (event.data === YT.PlayerState.PLAYING) {
                isPlaying = true; disc.classList.add('playing'); startLyricSync();
            } else {
                disc.classList.remove('playing'); stopLyricSync();
            }
        }

        function togglePlayPause() {
            if (!player) return;
            if (isPlaying) player.pauseVideo(); else player.playVideo();
        }

        function ensurePlayMusic() {
            if (player && player.playVideo && !isPlaying) player.playVideo();
        }
        document.body.addEventListener('click', ensurePlayMusic, { once: true });

        function startLyricSync() {
            clearInterval(lyricInterval);
            lyricInterval = setInterval(() => {
                if (!player || !player.getCurrentTime) return;
                const currentTime = player.getCurrentTime();
                const currentSong = playlist[0];
                let activeLyric = currentSong.lyrics[0].text;
                for (let i = 0; i < currentSong.lyrics.length; i++) {
                    if (currentTime >= currentSong.lyrics[i].time) activeLyric = currentSong.lyrics[i].text;
                }
                document.getElementById('lyricText').innerText = activeLyric;
            }, 500);
        }
        function stopLyricSync() { clearInterval(lyricInterval); }

        function changeMusic() {
            const val = document.getElementById('ytUrlInput').value.trim();
            if (!val) return;
            let videoId = val;
            if (val.includes("v=")) videoId = val.split("v=")[1].split("&")[0];
            else if (val.includes("youtu.be/")) videoId = val.split("youtu.be/")[1].split("?")[0];
            if (player && player.loadVideoById) player.loadVideoById(videoId);
        }
    </script>
</body>
</html>
